name: PANAM AutoCoder - offline validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent_mvp/**'
      - '.github/workflows/panam-autocoder.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate source syntax
        run: python3 -m py_compile agent_mvp/autocoder.py agent_mvp/issue_task.py
      - name: Test synthetic issue authorization parser
        run: python3 -B -m unittest discover -s agent_mvp/tests -p 'test_issue_task.py' -v
