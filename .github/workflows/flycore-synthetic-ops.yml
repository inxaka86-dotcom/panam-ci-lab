name: FlyCore synthetic ops canary

on:
  pull_request:
    paths:
      - 'flycore/run_synthetic_ops_canary.py'
      - '.github/workflows/flycore-synthetic-ops.yml'

permissions:
  contents: read

concurrency:
  group: flycore-synthetic-ops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-synthetic-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce public-only publication boundary
        run: python3 checks/publication_gate.py

      - name: Install pinned Arrow reader
        run: python3 -m pip install --disable-pip-version-check --no-input pyarrow==17.0.0

      - name: Download official public MaleCNS graph
        shell: bash
        run: |
          set -euo pipefail
          url='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather'
          out="${RUNNER_TEMP}/connectome-weights-male-cns-v1.0-minconf-0.5.feather"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error --output "${out}" "${url}"
          test -s "${out}"

      - name: Download official public MaleCNS annotations
        shell: bash
        run: |
          set -euo pipefail
          url='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather'
          out="${RUNNER_TEMP}/body-annotations-male-cns-v1.0-minconf-0.5.feather"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error --output "${out}" "${url}"
          test -s "${out}"

      - name: Run public synthetic PANAM-shaped contextual incident canary
        shell: bash
        run: |
          set -euo pipefail
          python3 flycore/run_synthetic_ops_canary.py \
            --graph "${RUNNER_TEMP}/connectome-weights-male-cns-v1.0-minconf-0.5.feather" \
            --annotations "${RUNNER_TEMP}/body-annotations-male-cns-v1.0-minconf-0.5.feather"
