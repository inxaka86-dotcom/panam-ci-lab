name: PANAM Public CI Lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: panam-public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce public-only publication boundary
        run: python3 checks/publication_gate.py

      - name: Run public synthetic smoke check
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/public_smoke.py
