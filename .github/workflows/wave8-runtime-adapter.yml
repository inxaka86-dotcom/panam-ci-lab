name: Wave 8 synthetic runtime adapter

on:
  pull_request:
    paths:
      - 'wave8/**'
      - 'WAVE8_RUNTIME_ADAPTER.md'
      - 'checks/publication_gate.py'
      - '.github/workflows/wave8-runtime-adapter.yml'
  push:
    branches: [main]
    paths:
      - 'wave8/**'
      - 'WAVE8_RUNTIME_ADAPTER.md'
      - 'checks/publication_gate.py'
      - '.github/workflows/wave8-runtime-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave8-runtime-adapter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-runtime-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Publication boundary
        run: python3 checks/publication_gate.py

      - name: Syntax check Wave 8 JavaScript
        run: |
          node --check wave8/runtime_adapter.js
          node --check wave8/runtime_adapter.test.js

      - name: Run Wave 8 synthetic tests
        run: node --test wave8/runtime_adapter.test.js
