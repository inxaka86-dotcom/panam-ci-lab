name: FlyCore PANAM-shaped temporal benchmark

on:
  pull_request:
    paths:
      - 'flycore/run_panam_shaped_temporal_benchmark.py'
      - '.github/workflows/flycore-panam-shaped-temporal.yml'

permissions:
  contents: read

concurrency:
  group: flycore-panam-shaped-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-panam-shaped-temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce public-only publication boundary
        run: python3 checks/publication_gate.py

      - name: Install pinned research dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input numpy==2.1.3 pyarrow==17.0.0

      - name: Download exact official MaleCNS graph
        shell: bash
        run: |
          set -euo pipefail
          url='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/connectome-weights-male-cns-v1.0-minconf-0.5.feather'
          out="${RUNNER_TEMP}/connectome-weights-male-cns-v1.0-minconf-0.5.feather"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error --output "${out}" "${url}"
          test -s "${out}"

      - name: Download exact official MaleCNS annotations
        shell: bash
        run: |
          set -euo pipefail
          url='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/body-annotations-male-cns-v1.0-minconf-0.5.feather'
          out="${RUNNER_TEMP}/body-annotations-male-cns-v1.0-minconf-0.5.feather"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error --output "${out}" "${url}"
          test -s "${out}"

      - name: Run synthetic PANAM-shaped R0-R3 benchmark
        shell: bash
        run: |
          set -euo pipefail
          python3 flycore/run_panam_shaped_temporal_benchmark.py \
            --graph "${RUNNER_TEMP}/connectome-weights-male-cns-v1.0-minconf-0.5.feather" \
            --annotations "${RUNNER_TEMP}/body-annotations-male-cns-v1.0-minconf-0.5.feather"
