name: PANAM Agent MVP (AiDostup)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Поручение агенту (по-русски)"
        required: true
        type: string
        default: "Изучи документацию OpenAI Agents SDK и кратко объясни запуск автономного агента со ссылками."
      model:
        description: "ID модели AiDostup"
        required: true
        type: string
        default: "gpt-6-luna"

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIDOSTUP_API_KEY: ${{ secrets.AIDOSTUP_API_KEY }}
      AGENT_TASK: ${{ inputs.task }}
      AGENT_MODEL: ${{ inputs.model }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check "openai-agents>=0.1" requests beautifulsoup4
      - name: Verify AiDostup secret is configured
        run: |
          if [ -z "$AIDOSTUP_API_KEY" ]; then
            echo "::error::Set GitHub Actions secret AIDOSTUP_API_KEY before starting."
            exit 1
          fi
      - name: Run agent through AiDostup
        run: python agent_mvp/main.py
      - name: Save report (including failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panam-agent-result
          path: reports/agent-report.md
          if-no-files-found: warn
