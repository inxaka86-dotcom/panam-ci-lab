name: PANAM Agent MVP - offline validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agent_mvp/**'
      - '.github/workflows/panam-agent-mvp.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Validate source syntax without external API
        run: python3 -m py_compile agent_mvp/main.py
