# Recheck after user confirms secret configured
name: Check AiDostup secret presence (no disclosure)
on:
  push:
    branches:
      - experiment/verify-aidostup-secret-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AIDOSTUP_CONFIGURED: ${{ secrets.AIDOSTUP_API_KEY != '' }}
      AID_LEGACY_CONFIGURED: ${{ secrets.AID_API_KEY != '' }}
    steps:
      - name: Inspect configuration without reading or printing secret values
        shell: bash
        run: |
          if [ "$AIDOSTUP_CONFIGURED" = "true" ]; then
            echo "RESULT: AIDOSTUP_API_KEY configured"
          else
            echo "RESULT: AIDOSTUP_API_KEY not available"
          fi
          if [ "$AID_LEGACY_CONFIGURED" = "true" ]; then
            echo "ALTERNATE: AID_API_KEY configured"
          else
            echo "ALTERNATE: AID_API_KEY not available"
          fi
          [ "$AIDOSTUP_CONFIGURED" = "true" ]
