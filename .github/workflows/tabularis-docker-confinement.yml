name: Public Tabularis MCP Docker isolation with no network and read-only root

on:
  pull_request:
    paths:
      - '.github/workflows/tabularis-docker-confinement.yml'
      - 'checks/tabularis_mcp_docker_public.py'
      - 'checks/tabularis_sandbox.Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-synthetic-confinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout only public experimental files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Public-only validation and deterministic harness self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/publication_gate.py
          python3 checks/tabularis_mcp_docker_public.py --selftest
          python3 checks/tabularis_upstream_redact_v032.py --selftest
          python3 checks/tabularis_audit_hardening_public.py --selftest
          python3 checks/tabularis_session_atomic_patch_public.py --selftest

      - name: Build public minimal Ubuntu runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker version --format '{{.Server.Version}}'
          docker build --pull \
            --file checks/tabularis_sandbox.Dockerfile \
            --tag panam-public-tabularis-sandbox:v1 checks
          docker image inspect panam-public-tabularis-sandbox:v1 \
            --format '{{.Id}}'

      - name: Prove container network, filesystem, permissions and resource limits
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/tabularis_mcp_docker_public.py --preflight
          echo "PUBLIC_DOCKER_NONROOT_NO_NETWORK_FILESYSTEM_ISOLATION=PASS"

      - name: Prepare Rust toolchain dependencies (host build only)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev
          cargo --version

      - name: Fetch immutable Tabularis and apply three previously proven patches
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.32.0 --single-branch \
            https://github.com/TabularisDB/tabularis.git "$RUNNER_TEMP/vendor"
          test "$(git -C "$RUNNER_TEMP/vendor" rev-parse HEAD)" = \
            "82ee2e7abbbfc2e26bd91536e3e16b924e280ddd"
          python3 checks/tabularis_upstream_redact_v032.py \
            --source "$RUNNER_TEMP/vendor/src-tauri/src/mcp/mod.rs"
          python3 checks/tabularis_audit_hardening_public.py \
            --mcp "$RUNNER_TEMP/vendor/src-tauri/src/mcp/mod.rs" \
            --activity "$RUNNER_TEMP/vendor/src-tauri/src/ai_activity.rs"
          python3 checks/tabularis_session_atomic_patch_public.py \
            --source "$RUNNER_TEMP/vendor/src-tauri/src/ai_activity.rs"

      - name: Build the real patched Tabularis CLI on disposable host
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vendor/src-tauri"
          cargo build --locked --no-default-features --bin tabularis --jobs 2
          test -x target/debug/tabularis

      - name: Execute real MCP in constrained nonroot Docker process
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/tabularis_mcp_docker_public.py \
            --binary "$RUNNER_TEMP/vendor/src-tauri/target/debug/tabularis"
          echo "PUBLIC_DOCKER_ISOLATED_NATIVE_TABULARIS_MCP=PASS"
