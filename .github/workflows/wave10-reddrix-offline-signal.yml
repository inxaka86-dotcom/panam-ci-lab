name: Wave 10 Reddrix offline signal

on:
  pull_request:
    paths:
      - 'wave10/reddrix_offline/**'
      - '.github/workflows/wave10-reddrix-offline-signal.yml'
  push:
    branches: [main]
    paths:
      - 'wave10/reddrix_offline/**'
      - '.github/workflows/wave10-reddrix-offline-signal.yml'

permissions:
  contents: read

jobs:
  offline-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce public-only boundary
        run: python3 checks/publication_gate.py
      - name: Run offline synthetic unittest suite
        working-directory: wave10/reddrix_offline
        run: python3 -m unittest discover -s tests -v
