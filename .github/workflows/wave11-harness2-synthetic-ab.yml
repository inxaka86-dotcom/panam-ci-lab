name: Wave 11 Harness2 synthetic legal/tender A/B

on:
  pull_request:
    paths:
      - "wave11/**"
      - ".github/workflows/wave11-harness2-synthetic-ab.yml"
  push:
    branches: [main]
    paths:
      - "wave11/**"
      - ".github/workflows/wave11-harness2-synthetic-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave11-harness2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HARNESS2_UPSTREAM_SHA: 1cfe254e8d25b15f37048c3730134686abe60335
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout public PANAM CI lab
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce public-only publication boundary
        run: python3 checks/publication_gate.py

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile test adapter
        run: python -m py_compile wave11/panam_harness2_ab.py

      - name: Fetch and verify exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/harness2-src"
          git init "${src}"
          git -C "${src}" remote add origin https://github.com/google-research/harness2.git
          git -C "${src}" fetch --depth=1 origin "${HARNESS2_UPSTREAM_SHA}"
          git -C "${src}" checkout --detach FETCH_HEAD
          test "$(git -C "${src}" rev-parse HEAD)" = "${HARNESS2_UPSTREAM_SHA}"
          git -C "${src}" remote remove origin
          echo "HARNESS2_SRC=${src}" >> "${GITHUB_ENV}"

      - name: Install only public upstream package
        run: python -m pip install --no-input --no-deps "${HARNESS2_SRC}"

      - name: Run two-domain scripted Harness2 A/B
        shell: bash
        run: |
          set -euo pipefail
          python wave11/panam_harness2_ab.py --output "${RUNNER_TEMP}/panam-harness2-ab"
