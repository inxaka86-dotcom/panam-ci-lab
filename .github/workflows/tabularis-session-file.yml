name: Public Tabularis MCP session file permission and symlink hardening

on:
  pull_request:
    paths:
      - '.github/workflows/tabularis-session-file.yml'
      - 'checks/tabularis_mcp_session_public.py'
      - 'checks/tabularis_session_atomic_patch_public.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-session-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout public experimental source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Public-only publication and Python acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/publication_gate.py
          python3 checks/tabularis_upstream_redact_v032.py --selftest
          python3 checks/tabularis_audit_hardening_public.py --selftest
          python3 checks/tabularis_session_atomic_patch_public.py --selftest
          python3 checks/tabularis_mcp_session_public.py --selftest

      - name: Install public Rust CLI build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev
          rustc --version
          cargo --version

      - name: Fetch immutable upstream and apply previously tested privacy patches
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.32.0 --single-branch \
            https://github.com/TabularisDB/tabularis.git "$RUNNER_TEMP/vendor"
          test "$(git -C "$RUNNER_TEMP/vendor" rev-parse HEAD)" = \
            "82ee2e7abbbfc2e26bd91536e3e16b924e280ddd"
          python3 checks/tabularis_upstream_redact_v032.py \
            --source "$RUNNER_TEMP/vendor/src-tauri/src/mcp/mod.rs"
          python3 checks/tabularis_audit_hardening_public.py \
            --mcp "$RUNNER_TEMP/vendor/src-tauri/src/mcp/mod.rs" \
            --activity "$RUNNER_TEMP/vendor/src-tauri/src/ai_activity.rs"

      - name: Compile baseline CLI with original session state writes
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vendor/src-tauri"
          cargo build --locked --no-default-features --bin tabularis --jobs 2
          test -x target/debug/tabularis

      - name: Prove insecure session mode and symlink-follow baseline on synthetic files
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/tabularis_mcp_session_public.py \
            --binary "$RUNNER_TEMP/vendor/src-tauri/target/debug/tabularis" \
            --variant baseline
          echo "MCP_SESSION_BASELINE_PERMISSION_AND_SYMLINK_REPRODUCED=PASS"

      - name: Apply fail-closed private atomic session metadata patch
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/tabularis_session_atomic_patch_public.py \
            --source "$RUNNER_TEMP/vendor/src-tauri/src/ai_activity.rs"
          echo "MCP_SESSION_ATOMIC_WRITE_PATCH=PASS"

      - name: Rebuild actual patched CLI
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vendor/src-tauri"
          cargo build --locked --no-default-features --bin tabularis --jobs 2
          test -x target/debug/tabularis

      - name: Require private session files, symlink safety and preserved MCP functionality
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/tabularis_mcp_session_public.py \
            --binary "$RUNNER_TEMP/vendor/src-tauri/target/debug/tabularis" \
            --variant hardened
          echo "MCP_SESSION_PRIVATE_ATOMIC_SYMLINK_PROTECTION=PASS"
