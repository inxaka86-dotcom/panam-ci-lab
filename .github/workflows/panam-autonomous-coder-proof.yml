name: PANAM autonomous coding agent proof (AiDostup)

on:
  push:
    branches:
      - experiment/panam-ai-coder-live-20261119
    paths:
      - .github/workflows/panam-autonomous-coder-proof.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  autonomous-code:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent dependencies
        run: python -m pip install --disable-pip-version-check "openai-agents>=0.1"
      - name: Verify deliberately failing baseline
        run: |
          if python -B -m unittest discover -s agent_mvp/coding_lab -p 'test_priority.py' -v; then
            echo "::error::Baseline unexpectedly passed: not a valid autonomous repair test"
            exit 1
          else
            echo "BASELINE_FAIL_CONFIRMED"
          fi
      - name: Autonomous AI coding and tests
        env:
          AIDOSTUP_API_KEY: ${{ secrets.AIDOSTUP_API_KEY }}
          AGENT_MODEL: gpt-6-luna
          PYTHONUNBUFFERED: '1'
        run: python -B agent_mvp/coder.py
      - name: Independent test validation after the agent
        run: |
          python -B -m unittest discover -s agent_mvp/coding_lab -p 'test_priority.py' -v
          if git diff --quiet -- agent_mvp/coding_lab/buggy.py; then
            echo "::error::No code changes were made by the agent"
            exit 1
          fi
          echo "AUTONOMOUS_REPAIR_VALIDATED"
      - name: Commit the agent's code change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "panam-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent_mvp/coding_lab/buggy.py
          git commit -m "agent: fix priority bucket boundary tests [skip ci]"
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $header" push origin "HEAD:$GITHUB_REF_NAME"
          echo "AGENT_CODE_COMMITTED"
      - name: Open pull request with validated autonomous patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "$GITHUB_REF_NAME" \
            --title "PANAM Agent: autonomous boundary-bug repair (isolated test)" \
            --body "The AiDostup-powered agent independently read the source, patched the permitted test file and ran unit tests. GitHub Actions also independently verified the fix. Test-only proof of concept; no production code. Human review required; do not merge automatically."
